<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!-- Citron : quartier stylisé, motif récurrent de la marque -->
  <symbol id="icon-lemon" viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="92" fill="#E6BC00" stroke="#111111" stroke-width="6"/>
    <circle cx="100" cy="100" r="80" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
    <circle cx="100" cy="100" r="68" fill="#FFD100" stroke="#111111" stroke-width="4"/>
    <g stroke="#111111" stroke-width="3" stroke-linecap="round">
      <line x1="100" y1="100" x2="100" y2="33" transform="rotate(0 100 100)"/>
      <line x1="100" y1="100" x2="100" y2="33" transform="rotate(45 100 100)"/>
      <line x1="100" y1="100" x2="100" y2="33" transform="rotate(90 100 100)"/>
      <line x1="100" y1="100" x2="100" y2="33" transform="rotate(135 100 100)"/>
      <line x1="100" y1="100" x2="100" y2="33" transform="rotate(180 100 100)"/>
      <line x1="100" y1="100" x2="100" y2="33" transform="rotate(225 100 100)"/>
      <line x1="100" y1="100" x2="100" y2="33" transform="rotate(270 100 100)"/>
      <line x1="100" y1="100" x2="100" y2="33" transform="rotate(315 100 100)"/>
    </g>
    <circle cx="100" cy="100" r="6" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <ellipse cx="78" cy="62" rx="8" ry="16" fill="#FFFFFF" opacity=".55" transform="rotate(-20 78 62)"/>
    <ellipse cx="128" cy="70" rx="6" ry="12" fill="#FFFFFF" opacity=".45" transform="rotate(25 128 70)"/>
  </symbol>

  <!-- Goutte / éclat : motif d'accompagnement du citron -->
  <symbol id="icon-drop" viewBox="0 0 100 100">
    <path d="M50 6 C68 34 86 54 86 74 A36 36 0 1 1 14 74 C14 54 32 34 50 6 Z" fill="#FFD100" stroke="#111111" stroke-width="5"/>
    <ellipse cx="42" cy="40" rx="6" ry="12" fill="#FFFFFF" opacity=".55" transform="rotate(-15 42 40)"/>
  </symbol>

  <!-- Mégaphone + 3 traits de son (élément officiel indissociable — planche DA) -->
  <symbol id="icon-megaphone" viewBox="0 0 135 100">
    <rect x="8" y="52" width="14" height="20" rx="3" fill="#FF4F9A" stroke="#111111" stroke-width="4"/>
    <rect x="12" y="70" width="8" height="16" rx="2" fill="#FF4F9A" stroke="#111111" stroke-width="4"/>
    <path d="M22 40 L62 14 A10 10 0 0 1 78 22 L78 86 A10 10 0 0 1 62 94 L22 68 Z"
          fill="#FFF7EA" stroke="#111111" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="66" cy="54" rx="10" ry="26" fill="#FF4F9A" stroke="#111111" stroke-width="4"/>
    <g stroke-linecap="round">
      <line x1="86" y1="30" x2="114" y2="12" stroke="#111111" stroke-width="13"/>
      <line x1="86" y1="30" x2="114" y2="12" stroke="#FFD100" stroke-width="9"/>
      <line x1="94" y1="54" x2="126" y2="54" stroke="#111111" stroke-width="13"/>
      <line x1="94" y1="54" x2="126" y2="54" stroke="#FF4F9A" stroke-width="9"/>
      <line x1="86" y1="78" x2="114" y2="96" stroke="#111111" stroke-width="13"/>
      <line x1="86" y1="78" x2="114" y2="96" stroke="#009FE3" stroke-width="9"/>
    </g>
  </symbol>

  <!-- Point d'exclamation stylisé — bleu de référence planche DA #009FE3 -->
  <symbol id="icon-bang" viewBox="0 0 40 100">
    <rect x="10" y="4" width="20" height="60" rx="10" fill="#009FE3" stroke="#111111" stroke-width="4"/>
    <circle cx="20" cy="86" r="12" fill="#009FE3" stroke="#111111" stroke-width="4"/>
  </symbol>

  <!-- Petit trait d'accent (dynamise les compositions — pas les ondes du mégaphone) -->
  <symbol id="icon-dash" viewBox="0 0 40 12">
    <rect x="2" y="2" width="36" height="8" rx="4" fill="currentColor"/>
  </symbol>

  <!-- T-shirt (aperçu produit) -->
  <symbol id="icon-tshirt" viewBox="0 0 100 100">
    <path d="M30 8 L10 24 L20 38 L30 32 V90 H70 V32 L80 38 L90 24 L70 8 Q60 18 50 18 Q40 18 30 8Z"
          fill="#FFD100" stroke="#111111" stroke-width="5" stroke-linejoin="round"/>
  </symbol>

  <!-- Sweat à capuche (aperçu produit) -->
  <symbol id="icon-hoodie" viewBox="0 0 100 100">
    <path d="M32 10 Q50 2 68 10 L86 26 L76 40 L68 34 V92 H32 V34 L24 40 L14 26 Z"
          fill="#FF4F9A" stroke="#111111" stroke-width="5" stroke-linejoin="round"/>
    <path d="M40 10 Q50 24 60 10" fill="none" stroke="#111111" stroke-width="4"/>
  </symbol>

  <!-- Casquette (aperçu produit) -->
  <symbol id="icon-cap" viewBox="0 0 100 100">
    <path d="M50 20 C74 20 90 36 90 52 H10 C10 36 26 20 50 20 Z"
          fill="#0066FF" stroke="#111111" stroke-width="5" stroke-linejoin="round"/>
    <path d="M8 52 H92 C92 60 84 64 70 64 H30 C16 64 8 60 8 52 Z"
          fill="#0052CC" stroke="#111111" stroke-width="5" stroke-linejoin="round"/>
  </symbol>

  <!-- Panier -->
  <symbol id="icon-cart" viewBox="0 0 100 100">
    <path d="M14 30 H86 L80 78 A8 8 0 0 1 72 85 H28 A8 8 0 0 1 20 78 Z"
          fill="#FFF7EA" stroke="#111111" stroke-width="6" stroke-linejoin="round"/>
    <path d="M32 30 V22 A18 18 0 0 1 68 22 V30" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
    <circle cx="40" cy="52" r="3.5" fill="#111111"/>
    <circle cx="60" cy="52" r="3.5" fill="#111111"/>
  </symbol>

  <!-- Réseaux sociaux -->
  <symbol id="icon-instagram" viewBox="0 0 24 24">
    <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <circle cx="17.2" cy="6.8" r="1.1" fill="currentColor"/>
  </symbol>
  <symbol id="icon-facebook" viewBox="0 0 24 24">
    <path d="M14 8.5h2.5V5H14c-2.2 0-4 1.8-4 4v2H8v3.5h2V21h3.5v-6.5H16l.5-3.5h-3V9c0-.6.4-1 1-1z" fill="currentColor"/>
  </symbol>
  <symbol id="icon-tiktok" viewBox="0 0 24 24">
    <path d="M13.5 3h2.3c.2 1.6 1.4 2.9 3.2 3.1v2.3c-1.2 0-2.3-.4-3.2-1v6.4c0 2.9-2.3 5.2-5.2 5.2S5.4 16.7 5.4 13.8c0-2.7 2-4.9 4.6-5.2v2.4a2.8 2.8 0 1 0 2.8 2.8V3z" fill="currentColor"/>
  </symbol>

</svg>
